<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ネオホッケー16ファール暗記クイズ！byワラビーズ2026</title>
  <meta name="description" content="ネオホッケー16個のファールを楽しく覚えよう！フラッシュカード・ランダム再生・4択・入力モード搭載。">
  <meta property="og:title" content="ネオホッケー16ファール暗記クイズ！byワラビーズ2026">
  <meta property="og:description" content="ネオホッケー16個のファールを楽しく覚えよう！フラッシュカード・ランダム再生・4択・入力モード搭載。">
  <meta property="og:image" content="./ogp.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ネオホッケー16ファール暗記クイズ！byワラビーズ2026">
  <meta name="twitter:description" content="ネオホッケー16個のファールを楽しく覚えよう！フラッシュカード・ランダム再生・4択・入力モード搭載。">
  <meta name="twitter:image" content="./ogp.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="appCard" class="quiz-card is-start" aria-live="polite">
      <header class="quiz-header">
        <div>
          <p class="eyebrow">ホッケー 16ファール</p>
          <h1 id="screenTitle">ファール暗記クイズ</h1>
        </div>
        <div class="header-tools">
          <button id="topReturnButton" class="return-button" type="button">トップに戻る</button>
          <div class="score-box">
            <span id="progressText">1 / 16</span>
            <strong id="scoreText">0点</strong>
          </div>
        </div>
      </header>

      <div id="startScreen" class="screen">
        <div class="top-visual-wrap">
          <img class="top-visual" src="./top.png" alt="ファール暗記クイズのトップ画像">
          <button id="soundToggleButton" class="sound-toggle-button" type="button" aria-pressed="false">音 ON</button>
        </div>
        <div class="mode-card-grid">
          <button id="flashcardModeButton" class="mode-card flash-card" type="button">
            <span>まずは覚える！カードをめくって確認</span>
            <strong>フラッシュカードモード</strong>
          </button>
          <button id="choiceModeButton" class="mode-card choice-card" type="button">
            <span>クイズに挑戦！選択肢から答える</span>
            <strong>4択モード</strong>
          </button>
          <button id="inputModeButton" class="mode-card input-card" type="button">
            <span>クイズに挑戦！自分でファール名を書く</span>
            <strong>入力モード</strong>
          </button>
        </div>
        <p class="top-credit">© 2026 ワラビーズ</p>
      </div>

      <div id="quizScreen" class="screen is-hidden">
        <p id="quizCounter" class="screen-counter">1/16</p>
        <div class="image-wrap" id="imageWrap">
          <img id="questionImage" src="./images_question/1.jpg" alt="ファールのイラスト">
        </div>

        <div class="question-row">
          <p id="questionText">この画像はどのファール？</p>
        </div>

        <div id="choices" class="choices"></div>

        <form id="inputAnswerForm" class="input-answer is-hidden">
          <label for="answerInput">ファール名を入力</label>
          <div class="input-row">
            <input id="answerInput" type="text" autocomplete="off" placeholder="例：キッキング">
          </div>
        </form>

        <button id="quizActionButton" class="primary-button compact-check-button" type="button" disabled>答え合わせ</button>

        <div id="resultBox" class="result-box is-hidden">
          <strong id="resultTitle" class="result-title"></strong>
          <p id="answerText"></p>
          <p id="descriptionText"></p>
        </div>
      </div>

      <div id="flashcardScreen" class="screen is-hidden">
        <p id="flashcardCounter" class="screen-counter">1/16</p>
        <div class="image-wrap flashcard-image-wrap">
          <img id="flashcardImage" src="./images_question/1.jpg" alt="フラッシュカード画像">
        </div>

        <button id="flipCardButton" class="primary-button flip-button" type="button">カードをめくる</button>
        <div class="flashcard-nav">
          <button id="prevCardButton" class="secondary-button" type="button">前へ</button>
          <button id="nextCardButton" class="secondary-button" type="button">次へ</button>
        </div>
        <button id="randomPlayButton" class="secondary-button random-play-button" type="button">ランダム再生</button>
        <div id="randomControls" class="random-controls is-hidden">
          <button id="pauseRandomButton" class="secondary-button" type="button">一時停止</button>
          <button id="resumeRandomButton" class="secondary-button" type="button" disabled>再開</button>
          <button id="stopRandomButton" class="secondary-button stop-random-button" type="button">停止</button>
        </div>
      </div>

      <div id="finishScreen" class="screen finish-screen is-hidden">
        <p class="eyebrow">結果</p>
        <h2 id="finalScore">16問中 <span>0問 正解</span></h2>
        <p id="finalMessage"></p>
        <button id="restartButton" class="primary-button" type="button">もう一度チャレンジ</button>
      </div>
    </section>

    <div id="confirmDialog" class="dialog-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="dialog-card">
        <h2 id="confirmTitle">トップ画面に戻りますか？</h2>
        <p>現在の進行状況はリセットされます。</p>
        <div class="dialog-actions">
          <button id="confirmReturnButton" class="primary-button inline-button" type="button">トップに戻る</button>
          <button id="cancelReturnButton" class="secondary-button dialog-cancel" type="button">キャンセル</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
